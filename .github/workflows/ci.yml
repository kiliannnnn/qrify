name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # jsdom requires Node 22.22+, so Node 20 runs everything except the
          # element tests. The library itself is still exercised there.
          - node: '20.x'
            script: test:core
          - node: '22.x'
            script: test
          - node: '24.x'
            script: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run ${{ matrix.script }}

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      # Fails if anything the exports map points at is missing from `files`.
      - run: npm pack --dry-run
